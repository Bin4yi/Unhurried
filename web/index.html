<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unhurried</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Unhurried</h1>
  <p class="sub">A voice layer that lets you finish your sentence.</p>

  <section class="card">
    <div class="row">
      <label for="mode">Mode</label>
      <select id="mode">
        <option value="unhurried">Unhurried</option>
        <option value="baseline">Baseline (normal voice bot)</option>
      </select>
      <button id="start" class="primary">Start</button>
      <button id="stop" disabled>Stop</button>
      <span id="status" class="status">Not listening</span>
    </div>
  </section>

  <section class="card">
    <h2>Live captions</h2>
    <div id="captions" class="captions"><span class="committed"></span> <span class="live"></span></div>
    <div id="cue" class="cue" role="status" aria-live="polite"><span class="dot"></span>Take your time</div>
  </section>

  <section id="confirm" class="card confirm" role="alertdialog" aria-live="assertive">
    <p id="confirm-text"></p>
    <div class="row">
      <button id="confirm-yes" class="primary">Yes</button>
      <button id="confirm-change">Change</button>
    </div>
  </section>

  <section class="card">
    <h2>Conversation</h2>
    <div id="chat" class="chat"></div>
    <div class="row" style="margin-top:12px">
      <input id="typed" type="text" placeholder="Type any time" aria-label="Type a message">
      <button id="send-typed">Send</button>
    </div>
  </section>

  <p class="muted">Audio is not stored. <a href="privacy.html">Privacy</a></p>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
